name: Code Quality & Testing

on:
  push:
    branches: [main, develop, qa]
  pull_request:
    branches: [main, develop, qa]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trujillo-y-asociados

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
 
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'
          cache-dependency-path: trujillo-y-asociados/pnpm-lock.yaml        
    
      - name: Install dependencies and devDependencies
        run: pnpm install --frozen-lockfile
    
      - name: Check Typescript & Astro Syntax
        run: pnpm run check

      - name: Run Unit Tests
        run: pnpm run test

      - name: Build project
        run: pnpm run build

      # - name: Validate HTML Semantics & Accessibility
      #   run: pnpm run test:html

      # - name: Validate Internal Links & Crawler Paths
      #   run: pnpm run test:links

      # Deferred E2E and Lighthouse tests to when we have a stable build and actual user flows to test against.
      # - name: Install Playwright Browsers
      #   run: pnpm playwright install --with-deps
      #   if: github.event_name == 'pull_request'

      # - name: Run E2E Tests
      #   run: pnpm run test:e2e
      #   if: github.event_name == 'pull_request'

      - name: Run Lighthouse SEO & Performance Audit
        uses: treosh/lighthouse-ci-action@v12
        if: github.event_name == 'pull_request'
        with:
          configPath: './trujillo-y-asociados/lighthouserc.json'
          uploadArtifacts: 'true'
          temporaryPublicStorage: 'true'
