name: Code Quality & Testing

on:
  push:
    branches: [main, develop, qa]
  pull_request:
    branches: [main, develop, qa]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: trujillo-y-asociados

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
 
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: trujillo-y-asociados/pnpm-lock.yaml        
    
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
    
      - name: Check Typescript & Astro Syntax
        run: pnpm astro check && pnpm tsc --noEmit

      - name: Build project
        run: pnpm run build

      # Deferred E2E and Lighthouse tests to when we have a stable build and actual user flows to test against.
